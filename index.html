<html>
  <head>
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
  </head>
  <body>
    <!--El atributo xr mode en a-scene permite visualizar la escena en realidad aumentada
    Por defecto estamos en realidad virtual(vr). Si se pone ar solo pone el botón ar en las gafas
    En xr pñodría pasar de vr a ar-->
    <a-scene xr-mode-ui="XRMode: xr">
      <a-assets>
        <img id="textura" src="cesped.jpg">
        <img id="fondo" src="imagen360.jpg">
      </a-assets>
      <!--Este es el proyecto anterior
      <a-box position="-1 3 -3" rotation="0 45 0" color="#4CC3D9"></a-box>
      <a-box position="2 0.5 -3" rotation="0 45 0" color="#4CC3D9"></a-box>

      
      <a-sphere position="0 1.25 -5" radius="1.25" color="#EF2D5E"></a-sphere>
      <a-cylinder position="1 0.75 -3" radius="0.5" height="1.5" color="#FFC65D"></a-cylinder>
      <a-cone position="1 2.25 -3" radius="0.5" height="2" color="yellow"></a-cone>
    -->
      <a-box position="-4 2 -3" height="5" width="1" depth="1" color="#4CC3D9" geometry="depth: 6; height: 4"></a-box>
      <a-box position="2 2 -3" rotation="90 0 0" height="5" width="1" depth="1" color="#4CC3D9" geometry="depth: 4; height: 6"></a-box>
      <a-box position="0 0.25 -3" rotation="0 0 90" height="5" width="1" depth="1" color="#4CC3D9" geometry="depth: 6; height: 4; width: 0.5"></a-box>
      <a-box position="2 2 -3" height="5" width="1" depth="1" color="#4CC3D9" geometry="depth: 6; height: 4"></a-box>
      
      <!--
      <a-box position="-1 3 -3" rotation="0 45 0" color="#4CC3D9"></a-box>
      <a-box position="-1 3 -3" rotation="0 45 0" color="#4CC3D9"></a-box>
    -->

      <a-plane position="0 0 -4" rotation="-90 0 0" width="10" height="10" color="#7BC8A4" src="#textura">

      </a-plane>
      <!El atributo de hide permite que se oculte la entidad en modo realidad virtual
      <a-sky hide-on-enter-ar src="#fondo"></a-sky>
    </a-scene>
  </body>
</html>
